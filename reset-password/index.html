<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#966540">
  <title>Reset password · SPV Property Calculator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <script src="../src/components/theme.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../styles/legal.css">
  <script defer src="../supabase-config.js"></script>
  <script defer src="../cloud.js"></script>
  <script type="module" src="../src/features/account/password-recovery.js"></script>
</head>
<body class="legal-page">
  <header class="legal-header">
    <a class="legal-brand" href="../">
      <img src="../icons/icon-192.png" alt="" width="42" height="42">
      <strong>SPV Property Calculator</strong>
    </a>
  </header>
  <main class="legal-main">
    <article class="legal-card">
      <h1 id="recovery-heading">Reset your password</h1>
      <p id="recovery-status" role="status"></p>
      <form id="recovery-request" hidden>
        <p>Enter your workspace email address to request a password reset link.</p>
        <label class="field">
          <span>Email address</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <div class="auth-actions dialog-actions">
          <button class="primary-btn" type="submit">Send reset link</button>
        </div>
      </form>
      <form id="recovery-update" hidden>
        <label class="field">
          <span>New password</span>
          <input name="password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label class="field">
          <span>Confirm new password</span>
          <input name="confirmation" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <div class="auth-actions dialog-actions">
          <button class="primary-btn" type="submit">Save new password</button>
        </div>
      </form>
      <noscript><p>Enable JavaScript to reset your password.</p></noscript>
      <p><a href="../">Back to sign in</a></p>
    </article>
  </main>
</body>
</html>
