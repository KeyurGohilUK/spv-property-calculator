name: Apply fixed editor save bar

on:
  push:
    branches:
      - agent/fixed-save-bar
    paths:
      - .github/workflows/apply-fixed-save-bar.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-save-bar
          fetch-depth: 0

      - name: Apply fixed save bar styles
        shell: bash
        run: |
          cat .tmp-fixed-save.css >> styles.css
          sed -i "s/spv-property-calculator-v1.7.8-listing-sticky-save/spv-property-calculator-v1.7.9-fixed-save-bar/" service-worker.js

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          npm test
          grep -q "#editorView .editor-topbar" styles.css
          grep -q "position: fixed" styles.css
          grep -q "v1.7.9-fixed-save-bar" service-worker.js

      - name: Remove temporary helper files
        shell: bash
        run: |
          rm .tmp-fixed-save.css
          rm .github/workflows/apply-fixed-save-bar.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css service-worker.js .tmp-fixed-save.css .github/workflows/apply-fixed-save-bar.yml
          git commit -m "Keep editor save bar fixed while scrolling"
          git push
