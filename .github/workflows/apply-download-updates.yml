name: Apply release update feature

on:
  push:
    branches:
      - agent/download-updates-release
    paths:
      - .github/workflows/apply-download-updates.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/download-updates-release
          fetch-depth: 0

      - name: Apply release update changes
        run: python .github/apply-download-updates.py

      - name: Validate
        run: |
          node --check app.js
          python -m json.tool release.json >/dev/null
          npm test
          grep -q "downloadUpdatesBtn" index.html
          grep -q "downloadAppUpdates" app.js
          grep -q "v1.8.1-release-updates" service-worker.js
          grep -q "release-update-card" styles.css

      - name: Remove temporary helper files
        run: rm .github/apply-download-updates.py .github/workflows/apply-download-updates.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css service-worker.js release.json .github/apply-download-updates.py .github/workflows/apply-download-updates.yml
          git commit -m "Add in-app release update refresh"
          git push
