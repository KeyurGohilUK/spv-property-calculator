name: Apply card cost breakdown
on:
  push:
    branches: [agent/card-purchase-refurb-breakdown]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python3 apply-card-cost-breakdown.py
      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          node -e "JSON.parse(require('fs').readFileSync('release.json','utf8'))"
          npm test
      - name: Clean helper files
        run: rm -f apply-card-cost-breakdown.py .github/workflows/apply-card-cost-breakdown.yml
      - name: Commit changes
        run: |
          git config user.name "Keyur Gohil"
          git config user.email "133516013+KeyurGohilUK@users.noreply.github.com"
          git add -A
          git commit -m "Clarify purchase cash and refurbishment on cards" || exit 0
          git push
