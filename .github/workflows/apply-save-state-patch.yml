name: Apply save-state patch

on:
  push:
    branches:
      - agent/save-state-ui
    paths:
      - .github/workflows/apply-save-state-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/save-state-ui

      - name: Apply generated patch
        run: |
          git apply save-state.patch
          rm save-state.patch
          rm .github/workflows/apply-save-state-patch.yml

      - name: Commit updated app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unsaved property save state"
          git push
