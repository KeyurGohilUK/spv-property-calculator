name: Apply save bar header gap

on:
  push:
    branches:
      - agent/save-bar-header-gap
    paths:
      - .github/workflows/apply-save-bar-gap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/save-bar-header-gap
          fetch-depth: 0

      - name: Add standard header gap
        shell: bash
        run: |
          sed -i 's/padding-top: 62px;/padding-top: 74px;/' styles.css
          sed -i 's/padding-top: 60px;/padding-top: 72px;/' styles.css
          sed -i 's/top: calc(var(--safe-top) + 74px);/top: calc(var(--safe-top) + 86px);/g' styles.css
          sed -i 's/spv-property-calculator-v1.7.9-fixed-save-bar/spv-property-calculator-v1.8.0-save-bar-gap/' service-worker.js

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          npm test
          grep -q 'top: calc(var(--safe-top) + 86px);' styles.css
          grep -q 'v1.8.0-save-bar-gap' service-worker.js

      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/apply-save-bar-gap.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css service-worker.js .github/workflows/apply-save-bar-gap.yml
          git commit -m "Add standard gap below app header"
          git push
