name: Apply deposit slider changes

on:
  push:
    branches:
      - agent/save-state-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/save-state-ui
          fetch-depth: 0
      - name: Apply deposit slider patch
        run: |
          git apply deposit-slider.patch
          rm deposit-slider.patch
          rm .github/workflows/apply-deposit-slider.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css service-worker.js deposit-slider.patch .github/workflows/apply-deposit-slider.yml
          git commit -m "Add deposit percentage slider"
          git push origin HEAD:agent/save-state-ui
