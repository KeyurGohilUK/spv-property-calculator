name: Apply SDLT card correction
on:
  push:
    branches: [agent/sdlt-card-label-clean2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: node apply-sdlt-card.cjs
      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          node -e "JSON.parse(require('fs').readFileSync('release.json','utf8'))"
          npm test
      - name: Cleanup and commit
        run: |
          rm -f apply-sdlt-card.cjs .github/workflows/apply-sdlt-card.yml
          git config user.name "Keyur Gohil"
          git config user.email "133516013+KeyurGohilUK@users.noreply.github.com"
          git add -A
          git commit -m "Show SDLT on property cards" || exit 0
          git push
