name: Cleanup viewing datetime marker
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'agent/viewing-date-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: rm -f VIEWING_DATETIME_RELEASE.md .github/workflows/cleanup-viewing-datetime-marker.yml
      - run: |
          git config user.name "Keyur Gohil"
          git config user.email "133516013+KeyurGohilUK@users.noreply.github.com"
          git add -A
          git commit -m "Clean viewing datetime marker" || exit 0
          git push origin HEAD:${{ github.head_ref }}
