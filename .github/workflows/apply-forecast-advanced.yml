name: Apply advanced forecasting
on:
  push:
    branches: [agent/forecasting-advanced-metrics]
    paths:
      - '.github/workflows/apply-forecast-advanced.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forecasting-advanced-metrics
      - name: Integrate advanced forecast assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('forecast.html')
          s=p.read_text()
          if './forecast-advanced.css' not in s:
              s=s.replace('<link rel="stylesheet" href="./forecast.css">','<link rel="stylesheet" href="./forecast.css">\n  <link rel="stylesheet" href="./forecast-advanced.css">')
          if './forecast-advanced.js' not in s:
              s=s.replace('<script defer src="./forecast.js"></script>','<script defer src="./forecast.js"></script>\n  <script defer src="./forecast-advanced.js"></script>')
          p.write_text(s)

          p=Path('app.js'); s=p.read_text(); s=s.replace("const APP_VERSION = '1.9.0';","const APP_VERSION = '1.10.0';")
          for asset in ["  './forecast-advanced.css',\n","  './forecast-advanced.js',\n"]:
              if asset.strip() not in s:
                  s=s.replace("  './forecast.js',\n", "  './forecast.js',\n"+asset)
          p.write_text(s)

          p=Path('service-worker.js'); s=p.read_text(); s=s.replace('spv-property-calculator-v1.9.0-forecasting','spv-property-calculator-v1.10.0-advanced-forecasting')
          for asset in ["  './forecast-advanced.css',\n","  './forecast-advanced.js',\n"]:
              if asset.strip() not in s:
                  s=s.replace("  './forecast.js',\n", "  './forecast.js',\n"+asset)
          p.write_text(s)

          Path('release.json').write_text('''{\n  "version": "1.10.0",\n  "notes": [\n    "Advanced forecast return breakdown and annualised return",\n    "Rent and occupancy stress testing with break-even rent",\n    "ICR, DSCR and LTV risk metrics",\n    "Refurbishment uplift and value-created analysis"\n  ]\n}\n''')
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check forecast.js
          node --check forecast-advanced.js
          node --check service-worker.js
          node test-calculations.mjs
          node test-storage.mjs
          node test-cloud-sync.mjs
          node -e "JSON.parse(require('fs').readFileSync('release.json','utf8'));JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add forecast.html app.js service-worker.js release.json forecast-advanced.js forecast-advanced.css
          git commit -m "Integrate advanced forecast metrics" || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-forecast-advanced.yml
          git commit -m "Remove advanced forecast integration workflow"
          git push