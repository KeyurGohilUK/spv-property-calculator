name: Apply viewing datetime now
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/viewing-date-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply changes
        run: node apply-viewing-datetime.js
      - name: Validate
        run: |
          node --check app.js
          node --check service-worker.js
          node -e "JSON.parse(require('fs').readFileSync('release.json','utf8'))"
          npm test
      - name: Remove helper files
        run: rm -f apply-viewing-datetime.js .github/workflows/apply-viewing-datetime.yml .github/workflows/apply-viewing-datetime-now.yml
      - name: Commit changes
        run: |
          git config user.name "Keyur Gohil"
          git config user.email "133516013+KeyurGohilUK@users.noreply.github.com"
          git add -A
          git commit -m "Combine viewing date and time" || exit 0
          git push origin HEAD:${{ github.head_ref }}
