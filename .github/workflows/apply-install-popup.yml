name: Apply install popup changes

on:
  push:
    branches:
      - agent/deposit-slider
    paths:
      - install-popup.patch
      - .github/workflows/apply-install-popup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deposit-slider
          fetch-depth: 0

      - name: Apply patch
        run: git apply --whitespace=fix install-popup.patch

      - name: Remove helper files
        run: |
          rm install-popup.patch
          rm .github/workflows/apply-install-popup.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css service-worker.js install-popup.patch .github/workflows/apply-install-popup.yml
          git commit -m "Add Android and iPhone install guide"
          git push
