name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy all Edge Functions to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in the GitHub production environment."
            exit 1
          fi

      - name: Run application tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test repository
        run: npm test

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all version-controlled Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify deployed functions
        shell: bash
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
