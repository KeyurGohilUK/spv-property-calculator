name: Apply property link and sticky save

on:
  push:
    branches:
      - agent/property-link-sticky-save
    paths:
      - .github/scripts/apply-property-link-sticky-save.py
      - .github/workflows/apply-property-link-sticky-save.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/property-link-sticky-save
          fetch-depth: 0
      - name: Apply changes
        run: python .github/scripts/apply-property-link-sticky-save.py
      - name: Validate
        run: |
          node --check app.js
          node test-calculations.mjs
          node test-storage.mjs
          node test-cloud-sync.mjs
          grep -q 'id="listingUrl"' index.html
          grep -q 'v1.7.8-listing-sticky-save' service-worker.js
      - name: Clean temporary helpers
        run: |
          rm .github/scripts/apply-property-link-sticky-save.py
          rm .github/workflows/apply-property-link-sticky-save.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add property listing link and sticky save"
          git push
