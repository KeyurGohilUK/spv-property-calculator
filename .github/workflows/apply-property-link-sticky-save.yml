name: Apply property link and sticky save

on:
  push:
    branches:
      - agent/property-link-sticky-save
    paths:
      - .github/workflows/apply-property-link-sticky-save.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/property-link-sticky-save
          fetch-depth: 0

      - name: Update property link and sticky save
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # index.html: add optional listing URL in Purchase details.
          p = Path('index.html')
          text = p.read_text()
          needle = '''              <label class="field">
                <span>Property Details <em>optional</em></span>
                <textarea id="details" name="details" rows="4" placeholder="Address, estate agent, auction details, property condition or notes"></textarea>
              </label>

              <div class="field-grid">'''
          replacement = '''              <label class="field">
                <span>Property Details <em>optional</em></span>
                <textarea id="details" name="details" rows="4" placeholder="Address, estate agent, auction details, property condition or notes"></textarea>
              </label>

              <label class="field listing-link-field">
                <span>Property Listing Link <em>optional</em></span>
                <div class="listing-link-input">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 21 3"></path><path d="M15 3h6v6"></path><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path></svg>
                  <input id="listingUrl" name="listingUrl" type="url" inputmode="url" autocomplete="url" maxlength="1000" placeholder="https://www.rightmove.co.uk/..." aria-describedby="listingUrlHelp listingUrlError">
                </div>
                <small id="listingUrlHelp">Rightmove, Zoopla, estate-agent or other web listing.</small>
                <small id="listingUrlError" class="error-text hidden">Enter a valid http:// or https:// property listing link.</small>
              </label>

              <div class="field-grid">'''
          if needle not in text:
              raise SystemExit('index purchase-details insertion point not found')
          p.write_text(text.replace(needle, replacement, 1))

          # app.js: listing URL model + validation + load + property-card link action.
          p = Path('app.js')
          text = p.read_text()

          needle = '''function normalizeDepositPercent(value) {
  const clamped = clamp(safeNumber(value), 0, 100);
  return Math.round(clamped / 5) * 5;
}

function getFormModel() {'''
          replacement = '''function normalizeDepositPercent(value) {
  const clamped = clamp(safeNumber(value), 0, 100);
  return Math.round(clamped / 5) * 5;
}

function normalizeListingUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const candidate = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : `https://${raw}`;
  try {
    const parsed = new URL(candidate);
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
    return parsed.href;
  } catch {
    return '';
  }
}

function getFormModel() {'''
          if needle not in text:
              raise SystemExit('normalizeListingUrl insertion point not found')
          text = text.replace(needle, replacement, 1)

          needle = '''    title: $('title').value.trim(),
    details: $('details').value.trim(),
    purchasePrice: safeNumber($('purchasePrice').value),'''
          replacement = '''    title: $('title').value.trim(),
    details: $('details').value.trim(),
    listingUrl: $('listingUrl').value.trim(),
    purchasePrice: safeNumber($('purchasePrice').value),'''
          if needle not in text:
              raise SystemExit('getFormModel listingUrl insertion point not found')
          text = text.replace(needle, replacement, 1)

          needle = '''  const deposit = safeNumber($('depositPercent').value);
  const depositValid = deposit >= 0 && deposit <= 100;

  $('titleError').classList.toggle('hidden', titleValid);
  $('priceError').classList.toggle('hidden', priceValid);
  $('depositPercent').setCustomValidity(depositValid ? '' : 'Deposit must be between 0% and 100%.');

  if (!titleValid || !priceValid || !depositValid) openPrimaryDetailsSection();

  if (!titleValid) $('title').focus();
  else if (!priceValid) $('purchasePrice').focus();
  else if (!depositValid) $('depositPercent').focus();

  return titleValid && priceValid && depositValid;'''
          replacement = '''  const deposit = safeNumber($('depositPercent').value);
  const depositValid = deposit >= 0 && deposit <= 100;
  const listingRaw = $('listingUrl').value.trim();
  const listingUrl = normalizeListingUrl(listingRaw);
  const listingValid = !listingRaw || Boolean(listingUrl);

  $('titleError').classList.toggle('hidden', titleValid);
  $('priceError').classList.toggle('hidden', priceValid);
  $('listingUrlError').classList.toggle('hidden', listingValid);
  $('listingUrl').setCustomValidity(listingValid ? '' : 'Enter a valid http:// or https:// property listing link.');
  $('depositPercent').setCustomValidity(depositValid ? '' : 'Deposit must be between 0% and 100%.');

  if (!titleValid || !priceValid || !depositValid || !listingValid) openPrimaryDetailsSection();

  if (!titleValid) $('title').focus();
  else if (!priceValid) $('purchasePrice').focus();
  else if (!listingValid) $('listingUrl').focus();
  else if (!depositValid) $('depositPercent').focus();

  if (listingValid && listingRaw && listingUrl !== listingRaw) $('listingUrl').value = listingUrl;
  return titleValid && priceValid && depositValid && listingValid;'''
          if needle not in text:
              raise SystemExit('validateForm block not found')
          text = text.replace(needle, replacement, 1)

          needle = '''  $('saveMessage').textContent = '';
  $('titleError').classList.add('hidden');
  $('priceError').classList.add('hidden');'''
          replacement = '''  $('saveMessage').textContent = '';
  $('titleError').classList.add('hidden');
  $('priceError').classList.add('hidden');
  $('listingUrlError').classList.add('hidden');
  $('listingUrl').setCustomValidity('');'''
          if needle not in text:
              raise SystemExit('resetForm listing reset point not found')
          text = text.replace(needle, replacement, 1)

          needle = '''  $('title').value = property.title || '';
  $('details').value = property.details || '';
  $('purchasePrice').value = property.purchasePrice ? formatInputValue(property.purchasePrice) : '';'''
          replacement = '''  $('title').value = property.title || '';
  $('details').value = property.details || '';
  $('listingUrl').value = property.listingUrl || '';
  $('purchasePrice').value = property.purchasePrice ? formatInputValue(property.purchasePrice) : '';'''
          if needle not in text:
              raise SystemExit('loadIntoForm listingUrl point not found')
          text = text.replace(needle, replacement, 1)

          # Replace active property-card rendering with a listing-link-aware version.
          pattern = re.compile(r'''    card\.innerHTML=`<div class="property-card-tools".*?</div>`;\n    card\.addEventListener\('click',\(event\)=>\{ if\(!event\.target\.closest\('button'\)\) showEditor\(property\.id\); \}\);''', re.S)
          match = pattern.search(text)
          if not match:
              # Current source uses no space before closing block; use a broader anchor.
              start = text.find('    card.innerHTML=`<div class="property-card-tools"')
              end_anchor = "    card.addEventListener('keydown'"
              end = text.find(end_anchor, start)
              if start < 0 or end < 0:
                  raise SystemExit('property card render block not found')
              old = text[start:end]
          else:
              old = match.group(0)

          new = '''    const listingUrl = normalizeListingUrl(property.listingUrl);
    const listingAction = listingUrl ? `<button class="property-card-icon-action listing" type="button" data-action="listing" aria-label="Open property listing for ${escapeHtml(propertyTitle)}" title="Open property listing" data-tooltip="Listing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 21 3"></path><path d="M15 3h6v6"></path><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"></path></svg></button>` : '';
    card.innerHTML=`<div class="property-card-tools" aria-label="Property actions">${listingAction}<button class="property-card-icon-action" type="button" data-action="duplicate" aria-label="Duplicate ${escapeHtml(propertyTitle)}" title="Duplicate property" data-tooltip="Duplicate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button><button class="property-card-icon-action archive" type="button" data-action="archive" aria-label="Archive ${escapeHtml(propertyTitle)}" title="Archive property" data-tooltip="Archive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M5 7l1 12h12l1-12"></path><path d="M9 11h6"></path><path d="M7 4h10l1 3H6l1-3Z"></path></svg></button></div><div class="property-card-header"><div><h3>${escapeHtml(propertyTitle)}</h3><p class="property-meta">Updated ${property.updatedAt?dateFormat.format(new Date(property.updatedAt)):'recently'}</p></div></div><div class="property-stats"><div><span>Purchase Price</span><strong>${money(calc.purchasePrice)}</strong></div><div><span>Deposit</span><strong>${numberFormat.format(calc.depositPercent)}% · ${money(calc.depositAmount)}</strong></div><div><span>Mortgage</span><strong>${money(calc.mortgageRequired)}</strong></div><div><span>Purchase Costs</span><strong>${money(calc.totalPurchaseCostsExcludingDeposit)}</strong></div></div><div class="property-total"><span>Total Cash Required</span><strong>${money(calc.totalCashRequired)}</strong></div>`;
    card.addEventListener('click',(event)=>{ if(!event.target.closest('button')) showEditor(property.id); });
    if (listingUrl) card.querySelector('[data-action="listing"]').addEventListener('click',()=>{ window.open(listingUrl,'_blank','noopener,noreferrer'); });
'''
          text = text.replace(old, new, 1)

          # Save a normalized URL, not the user's shorthand value.
          needle = '''  const { model, calc } = renderCalculation();
  try {
    const saved = saveProperty({ ...model, calculated: calc });'''
          replacement = '''  const { model, calc } = renderCalculation();
  model.listingUrl = normalizeListingUrl(model.listingUrl);
  try {
    const saved = saveProperty({ ...model, calculated: calc });'''
          if needle not in text:
              raise SystemExit('saveCurrentProperty normalization point not found')
          text = text.replace(needle, replacement, 1)

          p.write_text(text)

          # styles.css: sticky editor toolbar + link field/card layout.
          p = Path('styles.css')
          text = p.read_text()
          needle = '.property-card-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-right: 82px; }'
          replacement = '.property-card-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-right: 124px; }'
          if needle not in text:
              raise SystemExit('property-card-header style not found')
          text = text.replace(needle, replacement, 1)

          needle = '.editor-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }'
          replacement = '''.editor-topbar {
  position: sticky;
  top: calc(var(--safe-top) + 72px);
  z-index: 18;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: -6px -6px 14px;
  padding: 8px 8px;
  border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
  border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow: 0 8px 22px color-mix(in srgb, #000 8%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}'''
          if needle not in text:
              raise SystemExit('editor-topbar style not found')
          text = text.replace(needle, replacement, 1)

          marker = '.field textarea { resize: vertical; min-height: 100px; }\n'
          addition = '''.listing-link-input {
  display: flex;
  align-items: center;
  min-height: 50px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--bg);
  overflow: hidden;
}
.listing-link-input svg {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  margin-left: 13px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.listing-link-input input {
  min-height: 48px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
}
.listing-link-input:focus-within {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--border));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent);
}
.property-card-icon-action.listing:hover,
.property-card-icon-action.listing:focus-visible {
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 12%, var(--surface));
}
'''
          if marker not in text:
              raise SystemExit('listing CSS insertion marker not found')
          text = text.replace(marker, marker + addition, 1)

          # Small screens: three top-right card icons still fit, and sticky toolbar sits below app header.
          text += '''

/* v1.7.8 listing link + always-visible save */
@media (max-width: 430px) {
  .property-card-header { padding-right: 112px; }
  .property-card-tools { gap: 4px; }
  .property-card-icon-action { width: 33px; height: 33px; min-width: 33px; min-height: 33px; }
  #editorView .editor-topbar { top: calc(var(--safe-top) + 66px); margin-inline: -3px; }
}
'''
          p.write_text(text)

          # service worker cache bump.
          p = Path('service-worker.js')
          text = p.read_text()
          text, count = re.subn(r"spv-property-calculator-v[^']+", 'spv-property-calculator-v1.7.8-listing-sticky-save', text, count=1)
          if count != 1:
              raise SystemExit('service-worker cache version not found')
          p.write_text(text)
          PY

      - name: Validate
        run: |
          node --check app.js
          node test-calculations.mjs
          node test-storage.mjs
          node test-cloud-sync.mjs
          grep -q 'id="listingUrl"' index.html
          grep -q 'v1.7.8-listing-sticky-save' service-worker.js

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-property-link-sticky-save.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css service-worker.js .github/workflows/apply-property-link-sticky-save.yml
          git commit -m "Add property listing link and sticky save"
          git push
