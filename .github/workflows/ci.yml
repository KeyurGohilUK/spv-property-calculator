name: CI

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: Existing numbered migration filename to run manually on main
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run calculation, storage and sync tests
        run: npm test

      - name: Require release bump for cached app changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node check-pr-release.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run test:html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-database:
    name: Deploy Supabase migrations
    runs-on: ubuntu-latest
    needs:
      - unit
      - browser
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      MIGRATION_FILE: ${{ inputs.migration_file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newly added migration files
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            : > /tmp/new-migrations.txt
            if [[ -n "$MIGRATION_FILE" ]]; then
              if [[ ! "$MIGRATION_FILE" =~ ^Update\ [0-9]+\ -\ [A-Za-z0-9 _-]+\.sql$ ]]; then
                echo "Enter a numbered migration filename, for example: Update 25 - Appointment-based Expense Payers.sql" >&2
                exit 1
              fi
              migration_path="database/migrations/$MIGRATION_FILE"
              if [[ ! -f "$migration_path" ]]; then
                echo "Migration file not found: $migration_path" >&2
                exit 1
              fi
              printf '%s\n' "$migration_path" > /tmp/new-migrations.txt
            fi
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              BEFORE_SHA="$(git rev-list --max-parents=0 "$AFTER_SHA")"
            fi
            git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- 'database/migrations/Update *.sql' \
              | sort -V > /tmp/new-migrations.txt
          fi
          if [[ -s /tmp/new-migrations.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New migrations to deploy:"
            cat /tmp/new-migrations.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new numbered migrations in this push."
          fi

      - name: Require Supabase database connection secret
        if: steps.migrations.outputs.found == 'true'
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "Set the SUPABASE_DB_URL repository secret to the Supabase PostgreSQL connection string." >&2
            exit 1
          fi

      - name: Install PostgreSQL client
        if: steps.migrations.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migrations in order
        if: steps.migrations.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql "$SUPABASE_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file "$migration"
          done < /tmp/new-migrations.txt
