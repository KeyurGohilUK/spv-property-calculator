<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="../">
  <meta name="theme-color" content="#966540">
  <meta name="description" content="Manage multiple limited companies within your SPV workspace.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <script src="./src/components/theme.js"></script>
  <script type="module" src="./src/components/help-guide.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles/features/company.css">
  <title>Manage Companies · SPV Property Calculator</title>
</head>
<body class="auth-pending">
  <div id="app">
    <header class="app-header"><div class="header-inner">
      <a class="brand-home" href="./" aria-label="Back to property calculator">
        <img class="brand-logo" src="./icons/icon-192.png" alt="" width="42" height="42">
        <span class="brand-copy"><span class="eyebrow">UK Limited Company / SPV</span><span class="brand-title">SPV Property Calculator</span></span>
      </a>
    </div></header>
    <nav class="primary-app-nav" aria-label="Primary navigation" data-primary-navigation data-active-page="company"></nav>
    <main class="main-shell company-shell company-list-shell">
      <section class="hero-card company-hero">
        <div><p class="eyebrow">Company records</p><h1>Manage companies</h1><p class="muted">Create, sync and manage your SPV companies.</p></div>
        <div class="property-hero-actions" role="group" aria-label="Company actions">
          <span id="companyListSyncStatus" class="sync-status" role="status">Saved on this device</span>
          <button id="newCompanyBtn" class="primary-btn" type="button" aria-label="New Company">＋ New company</button>
        </div>
      </section>
      <section class="company-section" aria-labelledby="companyListTitle">
        <div class="company-section-heading"><div class="company-section-heading-copy"><p class="eyebrow">Your workspace</p><div class="company-section-title-line"><h2 id="companyListTitle">Companies</h2><span id="companyCount" class="company-count" role="status" aria-live="polite"><span class="sr-only"></span><span aria-hidden="true"></span></span></div></div></div>
        <p id="companyListMessage" class="muted company-list-message" role="status" aria-live="polite"></p>
        <div id="companyCards" class="company-cards"></div>
      </section>
    </main>
  </div>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./cloud.js"></script>
  <script type="module" src="./src/components/secondary-page-header.js"></script>
  <script type="module" src="./src/components/admin-menu.js"></script>
  <script type="module" src="./src/features/company/company-list.js"></script>
</body>
</html>
